<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Golden Brioche Top Bun -->
    <linearGradient id="logo_top_bun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6A743" />
      <stop offset="45%" stop-color="#E28928" />
      <stop offset="100%" stop-color="#B86214" />
    </linearGradient>

    <!-- Bottom Bun -->
    <linearGradient id="logo_bot_bun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E28928" />
      <stop offset="100%" stop-color="#9C4C0C" />
    </linearGradient>

    <!-- Grilled Patty -->
    <linearGradient id="logo_patty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#733919" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Melted Cheddar -->
    <linearGradient id="logo_cheese" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Crisp Lettuce -->
    <linearGradient id="logo_lettuce" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <!-- Fresh Leaf Sprout -->
    <linearGradient id="logo_leaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <!-- Tomato Slice -->
    <linearGradient id="logo_tomato" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Circle Background -->
  <circle cx="60" cy="60" r="54" fill="#2A52BE" fill-opacity="0.12" stroke="#2A52BE" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Fresh Organic Sprout on Top -->
  <g transform="translate(60, 24)">
    <path d="M-1 12 C-2 7, 2 3, 5 0" stroke="#15803D" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M4 0 C11 -3, 19 2, 17 8 C10 9, 6 6, 4 0 Z" fill="url(#logo_leaf)" />
  </g>

  <!-- Top Brioche Bun -->
  <path d="M26 48 C26 28, 94 28, 94 48 C94 51, 26 51, 26 48 Z" fill="url(#logo_top_bun)" />
  <!-- Bun Highlight -->
  <path d="M32 45 C35 34, 85 34, 88 45 C78 38, 42 38, 32 45 Z" fill="#FFF7ED" fill-opacity="0.5" />
  <!-- Sesame Seeds -->
  <circle cx="44" cy="38" r="1.4" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="60" cy="34" r="1.4" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="76" cy="38" r="1.4" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="52" cy="44" r="1.2" fill="#FFFFFF" fill-opacity="0.8" />
  <circle cx="68" cy="44" r="1.2" fill="#FFFFFF" fill-opacity="0.8" />

  <!-- Tomato Slices -->
  <rect x="30" y="50" width="26" height="4" rx="2" fill="url(#logo_tomato)" />
  <rect x="64" y="50" width="26" height="4" rx="2" fill="url(#logo_tomato)" />

  <!-- Wavy Crisp Lettuce Ribbon -->
  <path d="M23 54
           C27 51, 31 56, 36 53
           C41 50, 45 56, 50 53
           C55 50, 59 56, 64 53
           C69 50, 73 56, 78 53
           C83 50, 87 56, 92 53
           C97 51, 99 55, 96 59
           C92 61, 88 58, 83 60
           C78 62, 74 58, 69 60
           C64 62, 60 58, 55 60
           C50 62, 46 58, 41 60
           C36 62, 32 58, 27 60
           C22 59, 21 56, 23 54 Z"
        fill="url(#logo_lettuce)" />

  <!-- Cheddar Cheese Melt -->
  <path d="M25 61 L95 61 L91 66 L82 66 L78 73 L74 66 L58 66 L54 75 L50 66 L36 66 L31 71 L28 66 Z" fill="url(#logo_cheese)" />

  <!-- Flame-Grilled Patty -->
  <rect x="25" y="66" width="70" height="11" rx="5.5" fill="url(#logo_patty)" />

  <!-- Bottom Brioche Bun -->
  <path d="M28 78 C28 89, 92 89, 92 78 C92 77, 28 77, 28 78 Z" fill="url(#logo_bot_bun)" />
</svg>
