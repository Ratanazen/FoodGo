services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: foodgo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foodgo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: >
      bash -c "python manage.py migrate &&
               daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-local-docker-dev-key}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DATABASE_URL=postgres://postgres:password@db:5432/foodgo
      - DB_HOST=db
      - DB_NAME=foodgo
      - DB_USER=postgres
      - DB_PASS=password
      - REDIS_URL=redis://redis:6379/0

  frontend:
    image: ghcr.io/cirruslabs/flutter:stable
    working_dir: /app
    volumes:
      - ./foodgo_flutter:/app
    ports:
      - "8080:8080"
    command: >
      bash -c "flutter pub get && 
               flutter run -d web-server --web-port 8080 --web-hostname 0.0.0.0"

volumes:
  postgres_data:
