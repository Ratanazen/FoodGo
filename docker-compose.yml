version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: foodgo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: >
      bash -c "python manage.py migrate &&
               daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - DB_NAME=foodgo
      - DB_USER=postgres
      - DB_PASS=password
      - REDIS_URL=redis://redis:6379/0

  frontend:
    image: cirrusci/flutter:stable
    working_dir: /app
    volumes:
      - ./foodgo_flutter:/app
    ports:
      - "8080:8080"
    command: >
      bash -c "flutter pub get && 
               flutter run -d web-server --web-port 8080 --web-hostname 0.0.0.0"

volumes:
  postgres_data:
