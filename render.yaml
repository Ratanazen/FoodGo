services:
  - type: web
    name: foodgo-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "127.0.0.1,localhost,0.0.0.0,.onrender.com,food-go-app.vercel.app,foodgo.rtnaeam611.workers.dev"
      - key: ALLOWED_HOSTS
        value: "127.0.0.1,localhost,0.0.0.0,.onrender.com,food-go-app.vercel.app,foodgo.rtnaeam611.workers.dev"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://foodgo.rtnaeam611.workers.dev,https://food-go-app.vercel.app,https://foodgo-53pl.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://foodgo.rtnaeam611.workers.dev,https://food-go-app.vercel.app,https://foodgo-53pl.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BAKONG_ACCOUNT_ID
        value: "sonar_seang@bkrt"
      - key: BAKONG_MERCHANT_NAME
        value: "FoodGo Restaurant"
  - type: web
    name: foodgo-frontend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.frontend
    healthCheckPath: /healthz
