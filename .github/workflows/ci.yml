name: FoodGo CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-secret-audit:
    name: Secret & API Leak Prevention Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Ensure no .env or private secret files are tracked in git
      run: |
        echo "Verifying no secret environment files are committed..."
        if git ls-files | grep -E '(^|/)(\.env|\.env\..*)$' | grep -v '\.env\.example$'; then
          echo "ERROR: Real .env file detected in git repository! Remove it immediately."
          exit 1
        fi
        echo "No sensitive .env files detected in git tree."

  backend-test:
    name: Django Backend Test & Verification
    runs-on: ubuntu-latest
    needs: security-and-secret-audit
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: foodgo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: "ci-dummy-key-strictly-for-testing-purpose-minimum-50-characters"
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      PAYMENT_ENV: "sandbox"
      BAKONG_API_TOKEN: "ci-mock-bakong-token"
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/foodgo_test"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Django System Checks
      env:
        SECRET_KEY: "ci-dummy-key-strictly-for-testing-purpose-minimum-50-characters"
        DEBUG: "False"
        SECURE_SSL_REDIRECT: "False"
        PAYMENT_ENV: "sandbox"
        ABA_ENABLED: "False"
        ACLEDA_ENABLED: "False"
      run: |
        cd backend
        python manage.py check
    - name: Check for Missing Migrations
      env:
        SECRET_KEY: "ci-dummy-key-strictly-for-testing-purpose-minimum-50-characters"
      run: |
        cd backend
        python manage.py makemigrations --check --dry-run
    - name: Run Django Test Suite
      env:
        SECRET_KEY: "ci-dummy-key-strictly-for-testing-purpose-minimum-50-characters"
        DEBUG: "False"
        SECURE_SSL_REDIRECT: "False"
        PAYMENT_ENV: "sandbox"
        ABA_ENABLED: "True"
        ACLEDA_ENABLED: "True"
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/foodgo_test"
      run: |
        cd backend
        python manage.py test core
    - name: Verify MongoDB Helper & Configuration Integrity
      env:
        SECRET_KEY: "ci-dummy-key-strictly-for-testing-purpose-minimum-50-characters"
      run: |
        cd backend
        python -c "from core.mongodb import check_mongo_connection; print('MongoDB Check Result:', check_mongo_connection())"
    - name: Verify Static Assets Collection
      env:
        SECRET_KEY: "ci-dummy-key-strictly-for-testing-purpose-minimum-50-characters"
      run: |
        cd backend
        python manage.py collectstatic --noinput

  flutter-test:
    name: Flutter Analyze, Test & Web Build
    runs-on: ubuntu-latest
    needs: security-and-secret-audit
    steps:
    - uses: actions/checkout@v4
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'
        cache: true
    - name: Install dependencies
      run: |
        cd foodgo_flutter
        flutter pub get
    - name: Enforce Code Formatting
      run: |
        cd foodgo_flutter
        dart format --output=none --set-exit-if-changed lib test
    - name: Analyze code (Zero Warning Policy)
      run: |
        cd foodgo_flutter
        flutter analyze
    - name: Run Flutter Unit & Widget Tests
      run: |
        cd foodgo_flutter
        flutter test
    - name: Build Flutter Web Release
      run: |
        cd foodgo_flutter
        flutter build web --release
    - name: Upload Flutter Web Release Bundle
      uses: actions/upload-artifact@v4
      with:
        name: foodgo-web-build
        path: foodgo_flutter/build/web
        retention-days: 7

  android-build:
    name: Flutter Android APK Build Verification
    runs-on: ubuntu-latest
    needs: security-and-secret-audit
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'
        cache: true
    - name: Install dependencies
      run: |
        cd foodgo_flutter
        flutter pub get
    - name: Build Android Release APK
      run: |
        cd foodgo_flutter
        flutter build apk --release --no-codesign
    - name: Upload Android Release APK
      uses: actions/upload-artifact@v4
      with:
        name: foodgo-android-apk
        path: foodgo_flutter/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 7

  docker-build-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, flutter-test, android-build]
    steps:
    - uses: actions/checkout@v4
    - name: Validate Docker Compose Configuration
      run: |
        docker compose config
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Backend Docker Image
      run: |
        docker build -f Dockerfile -t foodgo-backend:ci .
    - name: Build Frontend Docker Image
      run: |
        docker build -f Dockerfile.frontend -t foodgo-frontend:ci .

  vercel-deployment:
    name: Vercel Continuous Deployment
    runs-on: ubuntu-latest
    needs: [backend-test, flutter-test, docker-build-verification]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Deploy to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: |
        if [ -n "$VERCEL_TOKEN" ]; then
          echo "Deploying production release to Vercel..."
          npx --yes vercel --token "$VERCEL_TOKEN" --prod --yes
          echo "Vercel deployment successfully completed."
        else
          echo "Notice: VERCEL_TOKEN secret is not set in GitHub repository settings. Skipping automated Vercel deployment."
        fi

  cloudflare-deployment:
    name: Cloudflare Workers Continuous Deployment
    runs-on: ubuntu-latest
    needs: [backend-test, flutter-test, docker-build-verification]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
    - uses: actions/checkout@v4
    - name: Download Built Web Bundle
      uses: actions/download-artifact@v4
      with:
        name: foodgo-web-build
        path: foodgo_flutter/build/web
    - name: Deploy to Cloudflare
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
          echo "Deploying production release to Cloudflare Workers..."
          if [ -d "foodgo_flutter/build/web" ] && [ -f "foodgo_flutter/build/web/index.html" ]; then
            echo "Syncing Flutter Web build to public directory..."
            mkdir -p public
            cp -r foodgo_flutter/build/web/* public/
          fi
          npx wrangler deploy
          echo "Cloudflare deployment successfully completed."
        else
          echo "Notice: CLOUDFLARE_API_TOKEN secret is not set in GitHub repository settings. Skipping automated Cloudflare deployment."
        fi

