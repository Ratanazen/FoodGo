<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FoodGo Academic Capstone Master Composition v4</title>
<style>
  @font-face { font-family: 'Fraunces'; src: url('./fonts/Fraunces.ttf') format('truetype'); font-weight: 100 900; font-style: normal; }
  @font-face { font-family: 'Inter'; src: url('./fonts/Inter.ttf') format('truetype'); font-weight: 100 900; font-style: normal; }
  @font-face { font-family: 'GeistMono'; src: url('./fonts/GeistMono.ttf') format('truetype'); font-weight: 100 900; font-style: normal; }
  @font-face { font-family: 'Kantumruy'; src: url('./fonts/KantumruyPro-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'Kantumruy'; src: url('./fonts/KantumruyPro-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; }
  @font-face { font-family: 'Moul'; src: url('./fonts/Moul-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent !important;
    font-family: 'Inter', 'Kantumruy', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #stage-root {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
  }

  #bg-canvas {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    z-index: 0;
    pointer-events: none;
  }

  /* EXECUTIVE NAVY KEYNOTE (Dark) & ARCHITECTURAL PEARL STUDIO (Light) */
  .theme-dark {
    --ink: #F8FAFC;
    --ink-muted: #94A3B8;
    --ink-soft: rgba(226, 232, 240, 0.80);
    --card-bg: rgba(15, 23, 42, 0.82);
    --card-active-bg: rgba(23, 36, 62, 0.96);
    --card-border: rgba(148, 163, 184, 0.20);
    --card-active-border: rgba(241, 90, 36, 0.92);
    --panel-bg: rgba(11, 18, 32, 0.88);
    --accent: #F15A24;
    --accent-soft: rgba(241, 90, 36, 0.18);
    --gold: #E6C173;
    --teal: #34D399;
    --sky: #38BDF8;
    --navy-pill: rgba(255, 255, 255, 0.08);
    --footer-bg: rgba(9, 14, 24, 0.90);
    --footer-border: rgba(230, 193, 115, 0.30);
    --pedestal-bg: linear-gradient(175deg, rgba(19, 30, 52, 0.92), rgba(9, 14, 24, 0.96));
    --km-title: #FFA377;
    --mockup-bg: #070B14;
  }

  .theme-paper {
    --ink: #0F172A;
    --ink-muted: #475569;
    --ink-soft: rgba(30, 41, 59, 0.80);
    --card-bg: rgba(255, 255, 255, 0.92);
    --card-active-bg: #FFFFFF;
    --card-border: rgba(15, 23, 42, 0.10);
    --card-active-border: #EA511B;
    --panel-bg: rgba(255, 255, 255, 0.94);
    --accent: #E24E18;
    --accent-soft: rgba(226, 78, 24, 0.11);
    --gold: #A16207;
    --teal: #059669;
    --sky: #0284C7;
    --navy-pill: rgba(15, 23, 42, 0.06);
    --footer-bg: rgba(255, 255, 255, 0.95);
    --footer-border: rgba(18, 52, 91, 0.22);
    --pedestal-bg: linear-gradient(175deg, rgba(255, 255, 255, 0.98), rgba(238, 242, 247, 0.98));
    --km-title: #C2410C;
    --mockup-bg: #E2E8F0;
  }

  /* 1. TOP HEADER BAR (y: 16..88) */
  .top-bar {
    position: absolute;
    left: 44px;
    right: 44px;
    top: 16px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 4;
  }

  .acleda-pill {
    display: flex;
    align-items: center;
    gap: 13px;
    height: 64px;
    padding: 7px 18px 7px 12px;
    background: #FFFFFF;
    border-radius: 15px;
    border: 1.5px solid #D4AF37;
    box-shadow: 0 10px 26px rgba(2, 6, 23, 0.16);
  }
  .acleda-pill img {
    height: 44px;
    width: auto;
    display: block;
    object-fit: contain;
  }
  .acleda-pill-divider {
    width: 1.5px;
    height: 32px;
    background: rgba(18, 52, 91, 0.18);
  }
  .acleda-pill-text { display: flex; flex-direction: column; gap: 2px; }
  .acleda-pill-km {
    font-family: 'Kantumruy', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #12345B;
    line-height: 1.2;
  }
  .acleda-pill-en {
    font-family: 'GeistMono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #9A6B13;
    font-weight: 700;
    text-transform: uppercase;
  }

  .header-center {
    display: flex;
    align-items: center;
    gap: 15px;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    padding: 9px 22px;
    border-radius: 999px;
    box-shadow: 0 10px 28px rgba(2, 6, 23, 0.10);
  }
  .brand-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .brand-chip img {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    object-fit: cover;
  }
  .ch-pill {
    padding: 5px 13px;
    border-radius: 999px;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'GeistMono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .progress-dots { display: flex; align-items: center; gap: 4px; margin-left: 2px; }
  .p-dot { width: 13px; height: 5px; border-radius: 99px; background: var(--card-border); }
  .p-dot.done { background: var(--gold); opacity: 0.9; }
  .p-dot.now { width: 28px; background: var(--accent); }

  .mode-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    color: var(--ink);
    font-family: 'GeistMono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    box-shadow: 0 10px 28px rgba(2, 6, 23, 0.10);
  }
  .live-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.22);
  }

  /* 2. TITANIUM PHONE BEZEL (Outer: x=44..400, y=110..856; Screen hole: x=56, y=122, w=332, h=722, r=26) */
  .phone-shell {
    position: absolute;
    left: 44px;
    top: 110px;
    width: 356px;
    height: 746px;
    border-radius: 38px;
    background: transparent;
    border: 12px solid #1E293B;
    box-shadow:
      0 0 0 2px rgba(230, 193, 115, 0.28),
      0 26px 60px rgba(2, 6, 23, 0.42);
    pointer-events: none;
    z-index: 3;
    transform-origin: center center;
  }
  .phone-notch {
    position: absolute;
    left: 50%;
    top: 7px;
    transform: translateX(-50%);
    width: 92px;
    height: 18px;
    border-radius: 99px;
    background: #0F172A;
    border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .phone-tag-bottom {
    position: absolute;
    left: 50%;
    bottom: -24px;
    transform: translateX(-50%);
    padding: 5px 14px;
    border-radius: 99px;
    background: linear-gradient(135deg, #F15A24, #D94816);
    color: #FFFFFF;
    font-family: 'GeistMono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    white-space: nowrap;
    box-shadow: 0 8px 20px rgba(241, 90, 36, 0.45);
  }

  /* 3. CENTER STAGE DECK (x=420..1508 -> w=1088, y=110..882 -> h=772) */
  .deck-stage {
    position: absolute;
    left: 420px;
    top: 108px;
    width: 1088px;
    height: 774px;
    display: flex;
    flex-direction: column;
    z-index: 4;
  }

  .eyebrow-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
  .eyebrow-bar { width: 30px; height: 4px; border-radius: 4px; background: var(--accent); }
  .eyebrow-text {
    font-family: 'GeistMono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .eyebrow-km {
    font-family: 'Kantumruy', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-muted);
  }

  .hero-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 40px;
    line-height: 1.08;
    letter-spacing: -0.025em;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .hero-subtitle-km {
    font-family: 'Kantumruy', sans-serif;
    font-weight: 700;
    font-size: 21px;
    line-height: 1.32;
    color: var(--km-title);
    margin-bottom: 12px;
  }

  /* Two-column Split Body for Explanation + App Visual Proof */
  .split-body {
    display: grid;
    grid-template-columns: 586px 484px;
    gap: 18px;
    flex: 1;
    min-height: 0;
  }

  .cards-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
    height: 100%;
    min-height: 0;
  }

  .point-card {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 13px 16px;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    overflow: hidden;
    flex: 1;
  }
  .point-card.compact {
    padding: 10px 14px;
    gap: 12px;
  }
  .point-card.active {
    background: var(--card-active-bg);
    border-color: var(--card-active-border);
    box-shadow: 0 12px 32px rgba(241, 90, 36, 0.18);
  }
  .point-card.past { opacity: 0.84; }
  .point-card.future { opacity: 0.65; }
  .point-rail {
    position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: var(--accent); opacity: 0;
  }
  .point-card.active .point-rail { opacity: 1; }

  .point-num {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--navy-pill);
    border: 1px solid var(--card-border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'GeistMono', monospace;
    font-size: 14px; font-weight: 800; color: var(--ink);
  }
  .point-card.active .point-num { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  .point-card.past .point-num { background: rgba(52, 211, 153, 0.16); border-color: var(--teal); color: var(--teal); }

  .point-body { flex: 1; min-width: 0; }
  .point-km {
    font-family: 'Kantumruy', sans-serif;
    font-weight: 700;
    font-size: 18px;
    line-height: 1.38;
    color: var(--ink);
    margin-bottom: 3px;
  }
  .point-card.compact .point-km { font-size: 16px; line-height: 1.3; margin-bottom: 2px; }
  .point-en {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 14px;
    line-height: 1.34;
    color: var(--ink-soft);
  }
  .point-card.compact .point-en { font-size: 13px; line-height: 1.25; }

  .point-pill {
    align-self: flex-start;
    flex-shrink: 0;
    padding: 5px 10px;
    border-radius: 8px;
    background: var(--navy-pill);
    border: 1px solid var(--card-border);
    font-family: 'GeistMono', monospace;
    font-size: 11px; font-weight: 700; color: var(--gold);
    white-space: nowrap;
  }
  .point-card.active .point-pill {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Spec / Highlight summary footer for 3-card left column (zero blank gap!) */
  .spec-bar {
    padding: 13px 16px;
    border-radius: 16px;
    background: var(--panel-bg);
    border: 1.5px solid var(--footer-border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .spec-bar-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'GeistMono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--gold);
  }
  .spec-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .spec-chip {
    padding: 5px 11px;
    border-radius: 8px;
    background: var(--navy-pill);
    border: 1px solid var(--card-border);
    font-family: 'Inter', 'Kantumruy', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }

  /* RIGHT VISUAL PROOF PANEL (IN-APP SCREENSHOT SPOTLIGHT + FILMSTRIP) */
  .proof-panel {
    border-radius: 20px;
    background: var(--panel-bg);
    border: 1.5px solid var(--card-border);
    box-shadow: 0 18px 44px rgba(2, 6, 23, 0.16);
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    height: 100%;
    min-height: 0;
  }
  .proof-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .proof-badge {
    display: flex; align-items: center; gap: 7px;
    padding: 4px 10px; border-radius: 99px;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    font-family: 'GeistMono', monospace;
    font-size: 11px; font-weight: 700; color: var(--accent);
  }
  .proof-step {
    font-family: 'GeistMono', monospace;
    font-size: 11px; font-weight: 700; color: var(--ink-muted);
  }

  .proof-hero-box {
    display: grid;
    grid-template-columns: 202px 1fr;
    gap: 12px;
    flex: 1;
    min-height: 0;
  }
  .hero-screen-frame {
    position: relative;
    border-radius: 18px;
    background: var(--mockup-bg);
    border: 3px solid #334155;
    box-shadow: 0 12px 26px rgba(2, 6, 23, 0.25);
    overflow: hidden;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-screen-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .hero-screen-pill {
    position: absolute;
    left: 8px; bottom: 8px;
    padding: 4px 9px;
    border-radius: 7px;
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.16);
    font-family: 'GeistMono', monospace;
    font-size: 10px; font-weight: 700; color: #F8FAFC;
  }

  .hero-zoom-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }
  .zoom-crop-card {
    position: relative;
    flex: 1;
    border-radius: 16px;
    overflow: hidden;
    background: var(--mockup-bg);
    border: 2px solid var(--accent);
    box-shadow: 0 10px 26px rgba(241, 90, 36, 0.16);
  }
  .zoom-crop-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .zoom-crop-tag {
    position: absolute;
    top: 8px; left: 8px;
    padding: 4px 9px;
    border-radius: 6px;
    background: var(--accent);
    color: #FFFFFF;
    font-family: 'GeistMono', monospace;
    font-size: 10px; font-weight: 800; letter-spacing: 0.06em;
  }
  .zoom-info-card {
    padding: 12px 13px;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .zoom-info-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 17px;
    line-height: 1.2;
    color: var(--ink);
  }
  .zoom-info-km {
    font-family: 'Kantumruy', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    line-height: 1.35;
    color: var(--km-title);
  }
  .zoom-info-en {
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    line-height: 1.32;
    color: var(--ink-soft);
  }

  /* Bottom Multi-Screen Filmstrip inside Right Panel */
  .filmstrip {
    display: grid;
    gap: 8px;
    height: 152px;
    flex-shrink: 0;
  }
  .film-thumb {
    position: relative;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    padding: 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    overflow: hidden;
  }
  .film-thumb.active {
    border-color: var(--accent);
    background: var(--card-active-bg);
    box-shadow: 0 8px 20px rgba(241, 90, 36, 0.25);
    transform: translateY(-2px);
  }
  .film-thumb img {
    width: 100%;
    height: 114px;
    object-fit: cover;
    object-position: top center;
    border-radius: 8px;
    display: block;
  }
  .film-thumb span {
    font-family: 'GeistMono', monospace;
    font-size: 10px;
    font-weight: 700;
    color: var(--ink-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .film-thumb.active span { color: var(--accent); }

  /* SPECIAL LAYOUT 06 TECH STACK (2x2 Stack Cards + Live App Proof Right) */
  .tech-2x2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
    height: 100%;
  }
  .tech-mini-card {
    padding: 15px 16px;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .tech-mini-card.active {
    background: var(--card-active-bg);
    border-color: var(--accent);
    box-shadow: 0 14px 32px rgba(226, 78, 24, 0.15);
  }
  .tech-name { font-family: 'Fraunces', serif; font-weight: 700; font-size: 21px; color: var(--ink); line-height: 1.15; }
  .tech-badge {
    display: inline-block; align-self: flex-start;
    padding: 3px 9px; border-radius: 99px;
    background: var(--accent-soft); border: 1px solid var(--accent);
    font-family: 'GeistMono', monospace; font-size: 10.5px; font-weight: 700; color: var(--accent);
    margin-bottom: 6px;
  }
  .tech-km { font-family: 'Kantumruy', sans-serif; font-weight: 700; font-size: 15.5px; color: var(--ink); margin-top: 6px; }
  .tech-en { font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.35; color: var(--ink-soft); margin-top: 4px; }
  .tech-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .t-pill {
    padding: 3px 8px; border-radius: 6px;
    background: var(--navy-pill); border: 1px solid var(--card-border);
    font-family: 'GeistMono', monospace; font-size: 11px; font-weight: 600; color: var(--ink);
  }

  /* SPECIAL LAYOUT 07 ARCHITECTURE (Vector Diagram Top + 5 Real UI/UX Screens Bottom) */
  .arch-stage {
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1;
    min-height: 0;
  }
  .arch-top {
    display: grid;
    grid-template-columns: 500px 1fr;
    gap: 16px;
    height: 410px;
    flex-shrink: 0;
  }
  .arch-top .cards-col { gap: 8px; }
  .arch-top .point-card.compact { padding: 8px 12px; }
  .arch-top .point-card.compact .point-km { font-size: 15px; line-height: 1.25; }
  .arch-top .point-card.compact .point-en { font-size: 12.5px; line-height: 1.22; }
  .vector-arch-box {
    border-radius: 18px;
    background: rgba(10, 16, 28, 0.94);
    border: 1.5px solid rgba(230, 193, 115, 0.42);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 16px 38px rgba(2, 6, 23, 0.35);
  }
  .v-tier {
    padding: 10px 13px;
    border-radius: 12px;
    background: rgba(30, 41, 59, 0.72);
    border: 1.5px solid rgba(148, 163, 184, 0.22);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .v-tier.active {
    background: rgba(30, 41, 59, 0.98);
    border-color: #F15A24;
    box-shadow: 0 0 0 2px rgba(241, 90, 36, 0.24);
  }
  .v-tier-l { display: flex; flex-direction: column; gap: 2px; }
  .v-tier-name { font-family: 'Fraunces', serif; font-weight: 700; font-size: 16px; color: #F8FAFC; }
  .v-tier-sub { font-family: 'Inter', sans-serif; font-size: 12px; color: #CBD5E1; }
  .v-tier-badge {
    padding: 4px 9px; border-radius: 7px;
    font-family: 'GeistMono', monospace; font-size: 11px; font-weight: 700;
    white-space: nowrap;
  }
  .v-arrow {
    text-align: center;
    font-family: 'GeistMono', monospace;
    font-size: 10.5px;
    font-weight: 700;

// Preload all images in memory so chapter/line transitions are instantaneous (0ms frame swap latency!)
const IMG_CACHE = {};
function preloadAllImages() {
  const urls = new Set([
    './assets/acleda_logo.png', './assets/icon.png',
    './assets/standing.png', './assets/think.png', './assets/find.png',
    './assets/investigate.png', './assets/run.png', './assets/delivery_bag.png',
    './assets/delivery_scooter.png', './assets/delivery_handover.png',
    ...Object.values(SCREENS),
    ...Object.values(CHAPTERS).map(c => c.backdrop).filter(Boolean),
  ]);
  const promises = [...urls].map(src => new Promise(res => {
    const im = new Image();
    im.onload = () => { IMG_CACHE[src] = im; res(); };
    im.onerror = () => res();
    im.src = src;
  }));
  return Promise.all(promises);
}
window.__readyPromise = preloadAllImages();

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBackground(ch, t) {
  const cvs = document.getElementById('bg-canvas');
  const ctx = cvs.getContext('2d');
  ctx.clearRect(0, 0, 1920, 1080);

  if (ch.theme === 'dark') {
    const g = ctx.createLinearGradient(0, 0, 1920, 1080);
    g.addColorStop(0, '#070B14');
    g.addColorStop(0.55, '#0F172A');
    g.addColorStop(1, '#09101F');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1920, 1080);

    const bd = IMG_CACHE[ch.backdrop];
    if (bd && bd.naturalWidth > 0) {
      ctx.save();
      ctx.globalAlpha = 0.28;
      ctx.drawImage(bd, 0, 0, 1920, 1080);
      ctx.restore();
    }

    const rg = ctx.createRadialGradient(1480, 240, 40, 1480, 240, 740);
    rg.addColorStop(0, 'rgba(241, 90, 36, 0.16)');
    rg.addColorStop(0.55, 'rgba(56, 189, 248, 0.06)');
    rg.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, 1920, 1080);

    ctx.strokeStyle = 'rgba(148, 163, 184, 0.045)';
    ctx.lineWidth = 1;
    for (let x = 44; x < 1920; x += 96) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke(); }
    for (let y = 44; y < 1080; y += 96) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke(); }
  } else {
    const g = ctx.createLinearGradient(0, 0, 1920, 1080);
    g.addColorStop(0, '#F8FAFC');
    g.addColorStop(0.55, '#F1F5F9');
    g.addColorStop(1, '#E7EEF6');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1920, 1080);

    const bd = IMG_CACHE[ch.backdrop];
    if (bd && bd.naturalWidth > 0) {
      ctx.save();
      ctx.globalAlpha = 0.06;
      ctx.drawImage(bd, 0, 0, 1920, 1080);
      ctx.restore();
    }

    const rg = ctx.createRadialGradient(420, 280, 30, 420, 280, 760);
    rg.addColorStop(0, 'rgba(226, 78, 24, 0.09)');
    rg.addColorStop(0.6, 'rgba(18, 52, 91, 0.04)');
    rg.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, 1920, 1080);

    ctx.strokeStyle = 'rgba(15, 23, 42, 0.04)';
    ctx.lineWidth = 1;
    for (let x = 44; x < 1920; x += 96) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke(); }
    for (let y = 44; y < 1080; y += 96) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke(); }
  }

  // Soft floor wave
  const phase = (t * 0.45 + ch.idx * 0.7) % (Math.PI * 2);
  ctx.save();
  ctx.strokeStyle = ch.theme === 'dark' ? 'rgba(230,193,115,0.16)' : 'rgba(226,78,24,0.12)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= 1920; x += 48) {
    const yy = 1008 + Math.sin(x * 0.005 + phase) * 7;
    if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
  }
  ctx.stroke();
  ctx.restore();

  // EXACT TRANSPARENT PHONE SCREEN CUTOUT (ACTIVE ACROSS ALL 14 CHAPTERS!)
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  roundRectPath(ctx, PHONE_HOLE.x, PHONE_HOLE.y, PHONE_HOLE.w, PHONE_HOLE.h, PHONE_HOLE.r);
  ctx.fillStyle = '#000000';
  ctx.fill();
  ctx.restore();
}

function renderCardStack(cards, activeIdx, t, compact = false) {
  return cards.map((c, i) => {
    const cls = i === activeIdx ? 'active' : (i < activeIdx ? 'past' : 'future');
    const delay = 0.12 * i;
    const enter = OM ? OM.sstep(delay, delay + 0.42, t) : 1;
    const ty = (1 - enter) * 14;
    const op = (cls === 'active' ? 1 : cls === 'past' ? 0.85 : 0.66) * (0.25 + 0.75 * enter);
    const badge = i < activeIdx ? '✓' : `0${i + 1}`;
    return `<div class="point-card ${compact ? 'compact' : ''} ${cls}" style="opacity:${op.toFixed(3)}; transform:translateY(${ty.toFixed(1)}px);">
      <div class="point-rail"></div>
      <div class="point-num">${badge}</div>
      <div class="point-body">
        <div class="point-km">${c.km}</div>
        <div class="point-en">${c.en}</div>
      </div>
      <div class="point-pill">${c.pill}</div>
    </div>`;
  }).join('');
}

function renderProofPanel(screens, activeIdx, t, badgeLabel = 'IN-APP VISUAL PROOF') {
  const safeIdx = Math.min(activeIdx, screens.length - 1);
  const s = screens[safeIdx];
  const enter = OM ? OM.sstep(0.08, 0.52, t) : 1;
  const cols = screens.length;
  return `<div class="proof-panel" style="opacity:${0.25 + 0.75 * enter}; transform:translateY(${((1 - enter) * 16).toFixed(1)}px);">
    <div class="proof-hdr">
      <span class="proof-badge">📱 ${badgeLabel}</span>
      <span class="proof-step">SCREEN 0${safeIdx + 1} / 0${cols} · ${s.label}</span>
    </div>
    <div class="proof-hero-box">
      <div class="hero-screen-frame">
        <img src="${s.img}" alt="${s.title}" />
        <span class="hero-screen-pill">${s.label}</span>
      </div>
      <div class="hero-zoom-col">
        <div class="zoom-crop-card">
          <img src="${s.img}" style="object-position:${s.focus}; transform:scale(1.22); transform-origin:${s.focus};" alt="${s.title} zoom" />
          <span class="zoom-crop-tag">UI FOCUS</span>
        </div>
        <div class="zoom-info-card">
          <div class="zoom-info-title">${s.title}</div>
          <div class="zoom-info-km">${s.km}</div>
          <div class="zoom-info-en">${s.en}</div>
        </div>
      </div>
    </div>
    <div class="filmstrip" style="grid-template-columns:repeat(${cols}, 1fr);">
      ${screens.map((sc, i) => `<div class="film-thumb ${i === safeIdx ? 'active' : ''}">
        <img src="${sc.img}" alt="${sc.label}" />
        <span>0${i + 1} · ${sc.label}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderStandardSplit(ch, activeIdx, t) {
  const compact = ch.cards.length >= 4;
  const specBlock = ch.specTitle ? `<div class="spec-bar">
    <div class="spec-bar-top"><span>⚡ ${ch.specTitle}</span><span>VERIFIED REPO</span></div>
    <div class="spec-chips">${ch.specChips.map(x => `<span class="spec-chip">${x}</span>`).join('')}</div>
  </div>` : '';

  return `<div class="split-body">
    <div class="cards-col">
      ${renderCardStack(ch.cards, activeIdx, t, compact)}
      ${specBlock}
    </div>
    ${renderProofPanel(ch.screens, activeIdx, t)}
  </div>`;
}

function renderTechStackSplit(ch, activeIdx, t) {
  const safeIdx = activeIdx % ch.quads.length;
  return `<div class="split-body">
    <div class="tech-2x2">
      ${ch.quads.map((q, i) => {
        const enter = OM ? OM.sstep(0.08 * i, 0.5 + 0.08 * i, t) : 1;
        return `<div class="tech-mini-card ${i === safeIdx ? 'active' : ''}" style="opacity:${0.25 + 0.75 * enter}; transform:translateY(${((1 - enter) * 14).toFixed(1)}px);">
          <div>
            <span class="tech-badge">${q.badge}</span>
            <div class="tech-name">${q.name}</div>
            <div class="tech-km">${q.km}</div>
            <div class="tech-en">${q.en}</div>
          </div>
          <div class="tech-pills">${q.pills.map(p => `<span class="t-pill">${p}</span>`).join('')}</div>
        </div>`;
      }).join('')}

  const kpis = [

          <div class="spec-chips">${ch.specChips.map(x => `<span class="spec-chip">${x}</span>`).join('')}</div>
        </div>

  return `<div class="split-body" style="grid-template-columns: 548px 522px;">

window.__setStage = function(segId, localT, activeIdx) {
  const ch = CHAPTERS[segId] || CHAPTERS.seg01_intro;
  document.getElementById('stage-root').className = ch.theme === 'dark' ? 'theme-dark' : 'theme-paper';

  drawBackground(ch, localT);

  document.getElementById('hdr-ch-pill').textContent = `CH ${String(ch.idx).padStart(2, '0')} / 14`;
  document.getElementById('hdr-mode-text').textContent = ch.modeTag;
  document.getElementById('hdr-dots').innerHTML = Array.from({ length: 14 }, (_, k) => {
    const i = k + 1;
    return `<span class="p-dot ${i < ch.idx ? 'done' : i === ch.idx ? 'now' : ''}"></span>`;
  }).join('');

  // Phone bezel shown cleanly on ALL 14 chapters!
  const phoneEl = document.getElementById('phone-shell');
  const pEnt = OM ? OM.sstep(0.0, 0.50, localT) : 1;
  phoneEl.style.display = 'block';
  phoneEl.style.opacity = pEnt;
  phoneEl.style.transform = `translateY(${((1 - pEnt) * 16).toFixed(1)}px)`;
  document.getElementById('phone-tag').textContent = ch.phoneTag;

  let bodyHtml = '';
  if (segId === 'seg06_tech_stack') bodyHtml = renderTechStackSplit(ch, activeIdx, localT);
  else if (segId === 'seg07_architecture') bodyHtml = renderArchitectureStage(ch, activeIdx, localT);
  else if (segId === 'seg09_results') bodyHtml = renderResultsStage(ch, activeIdx, localT);
  else if (segId === 'seg10_conclusion') bodyHtml = renderConclusionStage(ch, activeIdx, localT);
  else bodyHtml = renderStandardSplit(ch, activeIdx, localT);

  const deck = document.getElementById('main-deck');
  const tEnt = OM ? OM.sstep(0.02, 0.44, localT) : 1;
  deck.innerHTML = `
    <div style="opacity:${0.25 + 0.75 * tEnt}; transform:translateY(${((1 - tEnt) * 12).toFixed(1)}px);">
      <div class="eyebrow-row">
        <div class="eyebrow-bar"></div>
        <span class="eyebrow-text">${ch.eyebrowEn}</span>
        <span class="eyebrow-km">· ${ch.eyebrowKm}</span>
      </div>
      <h1 class="hero-title">${ch.titleEn}</h1>
      <div class="hero-subtitle-km">${ch.titleKm}</div>
    </div>
    ${bodyHtml}
  `;

  // Presenter broadcast frame + gentle audio-wave bars + natural float
  document.getElementById('pedestal-pose-tag').textContent = ch.poseTag;
  document.getElementById('pedestal-title').textContent = ch.pedTitle;
  document.getElementById('pedestal-km').textContent = ch.pedKm;
  document.getElementById('eq-bars').innerHTML = [0, 1, 2, 3, 4].map(k => {
    const h = 5 + Math.round((Math.sin(localT * Math.PI * 2 + k * 1.3 + ch.idx) * 0.5 + 0.5) * 10);
    return `<div class="eq-b" style="height:${h}px;"></div>`;
  }).join('');

  const avImg = document.getElementById('avatar-img');
  if (!avImg.src.endsWith(ch.pose)) avImg.src = `./assets/${ch.pose}`;
  const bob = Math.sin(localT * Math.PI + ch.idx) * 4.0;
  const avEnt = OM ? OM.sstep(0.05, 0.50, localT) : 1;
  avImg.style.transform = `translateY(${(bob + (1 - avEnt) * 18).toFixed(2)}px) scale(${(0.96 + 0.04 * avEnt).toFixed(4)})`;
  avImg.style.opacity = avEnt;
};

// Caption overlay renderer (1920x114 transparent bar at y=896)
window.__renderCaptionOnly = function(kmText, enText, theme) {
  document.body.innerHTML = '';
  document.body.style.width = '1920px';
  document.body.style.height = '114px';
  document.body.style.background = 'transparent';
  const box = document.createElement('div');
  const dark = theme === 'dark';
  box.style.cssText = `
    width: 1812px; height: 102px; margin: 6px auto 0 auto;
    border-radius: 16px;
    background: ${dark ? 'rgba(9, 14, 24, 0.92)' : 'rgba(255, 255, 255, 0.96)'};
    border: 1.5px solid ${dark ? 'rgba(241, 90, 36, 0.72)' : 'rgba(226, 78, 24, 0.65)'};
    box-shadow: 0 10px 28px rgba(2, 6, 23, 0.22);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px 34px; text-align: center;
  `;
  box.innerHTML = `
    <div style="font-family:'Kantumruy',sans-serif; font-weight:700; font-size:26px; line-height:1.34; color:${dark ? '#F8FAFC' : '#0F172A'};">${kmText}</div>
    <div style="font-family:'Inter',sans-serif; font-weight:600; font-size:17.5px; line-height:1.25; color:${dark ? '#E6C173' : '#C2410C'}; margin-top:2px;">${enText}</div>
  `;
  document.body.appendChild(box);
};
